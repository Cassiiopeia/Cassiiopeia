name: SUH-WAKA-README

on:
  schedule:
    # 스케줄
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

jobs:
  update-readme:
    name: suh-update-readme-metrics
    runs-on: ubuntu-latest
    steps:
      - name: waka-stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets._GITHUB_PAT_TOKEN }}
          
          # 기본 정보 표시
          # 줄 수·커밋 수 통계는 템플릿 동기화 커밋까지 합산돼 수치가 과장되므로 끈다
          SHOW_SHORT_INFO: "True"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "True"
          
          # 차트 및 그래프
          SHOW_LOC_CHART: "False"
          
          # 프로젝트 및 언어 통계
          SHOW_PROJECTS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          
          # 시간대별 활동
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_COMMIT: "False"
          SHOW_TIMEZONE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          
          # 개발 환경
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          
          # 추가 통계
          SHOW_UPDATED_DATE: "True"
          
          # 커밋 설정
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "📊 Updated with Dev Metrics"
          COMMIT_SINGLE: "False"
          
          # 로케일 및 포맷
          LOCALE: "ko"
          UPDATED_DATE_FORMAT: "%Y년 %m월 %d일 %H:%M:%S UTC"
          
          # 기타 설정
          SECTION_NAME: "waka"
          SYMBOL_VERSION: "3"
          DEBUG_LOGGING: "True"

          # 배지 스타일
          BADGE_STYLE: "for-the-badge"
